name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  spa:
    name: spa script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The web UI is one HTML file with an inline script; nothing else parses
      # it. node ships with the runner image: fail loudly if it ever stops.
      - run: node --version
      - run: bash scripts/check-spa.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Sandbox tests want a backend on Linux; ubuntu needs bubblewrap. The
      # package mirror is sometimes unreachable from a runner, so retry: the
      # suite degrades to no sandbox instead of failing on the install.
      - if: runner.os == 'Linux'
        name: install bubblewrap
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap; then
              exit 0
            fi
            echo "apt failed (attempt $attempt); retrying" >&2
            sleep 15
          done
          echo "warning: bubblewrap unavailable; the suite runs without the OS sandbox"
      # Control-plane tests that need Postgres are #[ignore]d when DATABASE_URL
      # is unset, so no service container is needed here.
      - run: cargo test --locked --workspace

  control:
    name: control plane (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FREEDAS_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The control-plane tests need a real database. They share one, so they
      # run one at a time: one of them drops the auth tables.
      - run: cargo test --locked -p freedas-control -- --include-ignored --test-threads=1

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Headless runs prefer an OS sandbox backend; ubuntu needs bubblewrap.
      # macOS ships sandbox-exec, so this matrix covers both backends. The
      # e2e refuses to run unsandboxed, so a missing package fails the job -
      # but the mirror is sometimes unreachable, so retry first.
      - if: runner.os == 'Linux'
        name: install bubblewrap
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap; then
              exit 0
            fi
            echo "apt failed (attempt $attempt); retrying" >&2
            sleep 15
          done
          echo "bubblewrap is required for the e2e sandbox scenarios" >&2
          exit 1
      - run: cargo build --locked -p freedas
      - run: FREEDAS_BIN=$PWD/target/debug/freedas bash scripts/e2e.sh
