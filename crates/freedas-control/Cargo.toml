[package]
name = "freedas-control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "freedas-control"
path = "src/main.rs"

[dependencies]
freedas-core = { path = "../freedas-core" }
freedas-review = { path = "../freedas-review" }
freedas-web = { path = "../freedas-web" }
axum.workspace = true
tokio.workspace = true
clap = { workspace = true, features = ["env"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "tls-rustls-ring"] }
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ulid.workspace = true
rand = "0.10"
reqwest.workspace = true
time.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
tempfile.workspace = true
