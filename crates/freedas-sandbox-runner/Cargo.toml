[package]
name = "freedas-sandbox-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "freedas-sandbox-runner"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
freedas-core = { path = "../freedas-core" }
reqwest.workspace = true
ulid.workspace = true
bollard = "0.21"
kube = "5"
# kube needs one Kubernetes API version selected; only this crate uses kube.
k8s-openapi = { version = "0.29", features = ["latest"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "tls-rustls-ring"] }
