</text><text x="140" y="616" text-anchor="end" fill="#e6edf3" font-size="12" font-weight="400">Aider</text><rect x="152" y="602" width="438.0" height="19" rx="5" fill="#39415a" stroke="#4a5578" stroke-width="1"/><text x="599" y="616" fill="#8b93a7" font-size="11.5" font-weight="400">653 MB</text><text x="152" y="648" fill="#8b93a7" font-size="10">Binary + required runtime. agentty.org values; freedas is one stripped binary, no bundled</text><text x="152" y="662" fill="#8b93a7" font-size="10">runtime.</text><line x1="28" y1="694" x2="820" y2="694" stroke="#232c42" stroke-width="1"/><text x="28" y="704" fill="#e6edf3" font-size="14" font-weight="650">Per-prompt harness tax</text><text x="820" y="704" text-anchor="end" fill="#8b93a7" font-size="10.5">lower is better · log</text><text x="140" y="730" text-anchor="end" fill="#34d399" font-size="12" font-weight="600">freedas</text><rect x="152" y="716" width="163.9" height="19" rx="5" fill="url(#fdg)"/><text x="325" y="730" fill="#34d399" font-size="11.5" font-weight="600">13 ms</text><rect x="752" y="715.5" width="66" height="20" rx="10" fill="#0e3a30"/><text x="785" y="729.5" text-anchor="middle" fill="#5eead4" font-size="10.5" font-weight="700">6× faster</text><text x="140" y="758" text-anchor="end" fill="#e6edf3" font-size="12" font-weight="400">freedas (pre-lazy)</text><rect x="152" y="744" width="255.4" height="19" rx="5" fill="#39415a" stroke="#4a5578" stroke-width="1"/><text x="416" y="758" fill="#8b93a7" font-size="11.5" font-weight="400">80 ms</text><text x="140" y="786" text-anchor="end" fill="#e6edf3" font-size="12" font-weight="400">Claude Code overhead</text><rect x="152" y="772" width="408.9" height="19" rx="5" fill="#39415a" stroke="#4a5578" stroke-width="1"/><text x="570" y="786" fill="#8b93a7" font-size="11.5" font-weight="400">1.69 s</text><text x="140" y="814" text-anchor="end" fill="#e6edf3" font-size="12" font-weight="400">median model response</text><rect x="152" y="800" width="438.0" height="19" rx