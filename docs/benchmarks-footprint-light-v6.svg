<svg xmlns="http://www.w3.org/2000/svg" width="848" height="1536" viewBox="0 0 848 1536" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img" aria-label="freedas — footprint &amp; efficiency benchmarks"><defs><linearGradient id="fdg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs><rect width="848" height="1536" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="28" y="38" fill="#1f2328" font-size="21" font-weight="700">freedas — footprint &amp; efficiency benchmarks</text><text x="28" y="60" fill="#59636e" font-size="12">vs every published same-rig number · lower is better</text><text x="28" y="98" fill="#1f2328" font-size="14" font-weight="650">Idle memory (RSS)</text><text x="820" y="98" text-anchor="end" fill="#59636e" font-size="10.5">lower is better</text><text x="250" y="132" text-anchor="end" fill="#059669" font-size="12" font-weight="600">freedas</text><rect x="262" y="118" width="10.3" height="19" rx="5" fill="url(#fdg)"/><text x="281" y="132" fill="#059669" font-size="11.5" font-weight="600">15 MB</text><rect x="532" y="114" width="286" height="13" rx="6.5" fill="#fdeee3"/><text x="675" y="123.8" text-anchor="middle" fill="#8a3b12" font-size="8.8" font-weight="700">Idle RSS: 10× leaner than Claude Code · 152MB→15MB</text><rect x="564" y="130" width="254" height="13" rx="6.5" fill="#d8f3e8"/><text x="691" y="139.8" text-anchor="middle" fill="#046a4e" font-size="8.8" font-weight="700">Idle RSS: 10× leaner than Codex · 152MB→15MB</text><text x="250" y="168" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">agentty</text><rect x="262" y="154" width="14.5" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="285" y="168" fill="#59636e" font-size="11.5" font-weight="400">21 MB</text><text x="250" y="204" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Aider</text><rect x="262" y="190" width="50.9" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="322" y="204" fill="#59636e" font-size="11.5" font-weight="400">74 MB</text><text x="250" y="240" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">jcode</text><rect x="262" y="226" width="72.9" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="344" y="240" fill="#59636e" font-size="11.5" font-weight="400">106 MB</text><text x="250" y="276" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Claude Code</text><rect x="262" y="262" width="104.6" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="376" y="276" fill="#59636e" font-size="11.5" font-weight="400">152 MB</text><text x="250" y="312" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Codex CLI</text><rect x="262" y="298" width="104.6" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="376" y="312" fill="#59636e" font-size="11.5" font-weight="400">152 MB</text><text x="250" y="348" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Gemini CLI</text><rect x="262" y="334" width="303.5" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="574" y="348" fill="#59636e" font-size="11.5" font-weight="400">441 MB</text><text x="250" y="384" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">opencode</text><rect x="262" y="370" width="448.0" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="719" y="384" fill="#59636e" font-size="11.5" font-weight="400">651 MB</text><text x="262" y="416" fill="#59636e" font-size="10">RSS while waiting for input. agentty.org same-rig medians; freedas on the release</text><text x="262" y="430" fill="#59636e" font-size="10">build.</text><line x1="28" y1="466" x2="820" y2="466" stroke="#d0d7de" stroke-width="1"/><text x="28" y="484" fill="#1f2328" font-size="14" font-weight="650">Disk footprint</text><text x="820" y="484" text-anchor="end" fill="#59636e" font-size="10.5">lower is better</text><text x="250" y="518" text-anchor="end" fill="#059669" font-size="12" font-weight="600">freedas</text><rect x="262" y="504" width="11.0" height="19" rx="5" fill="url(#fdg)"/><text x="282" y="518" fill="#059669" font-size="11.5" font-weight="600">16 MB</text><rect x="548" y="500" width="270" height="13" rx="6.5" fill="#fdeee3"/><text x="683" y="509.8" text-anchor="middle" fill="#8a3b12" font-size="8.8" font-weight="700">Disk: 20× smaller than Claude Code · 325MB→16MB</text><rect x="581" y="516" width="237" height="13" rx="6.5" fill="#d8f3e8"/><text x="699" y="525.8" text-anchor="middle" fill="#046a4e" font-size="8.8" font-weight="700">Disk: 33× smaller than Codex · 536MB→16MB</text><text x="250" y="554" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">agentty</text><rect x="262" y="540" width="15.8" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="287" y="554" fill="#59636e" font-size="11.5" font-weight="400">23 MB</text><text x="250" y="590" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">jcode</text><rect x="262" y="576" width="111.8" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="383" y="590" fill="#59636e" font-size="11.5" font-weight="400">163 MB</text><text x="250" y="626" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Gemini CLI</text><rect x="262" y="612" width="135.2" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="406" y="626" fill="#59636e" font-size="11.5" font-weight="400">197 MB</text><text x="250" y="662" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Claude Code</text><rect x="262" y="648" width="223.0" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="494" y="662" fill="#59636e" font-size="11.5" font-weight="400">325 MB</text><text x="250" y="698" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">opencode</text><rect x="262" y="684" width="280.6" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="552" y="698" fill="#59636e" font-size="11.5" font-weight="400">409 MB</text><text x="250" y="734" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Codex CLI</text><rect x="262" y="720" width="367.7" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="639" y="734" fill="#59636e" font-size="11.5" font-weight="400">536 MB</text><text x="250" y="770" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Aider</text><rect x="262" y="756" width="448.0" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="719" y="770" fill="#59636e" font-size="11.5" font-weight="400">653 MB</text><text x="262" y="802" fill="#59636e" font-size="10">Binary + required runtime. agentty.org values; freedas is one stripped binary, no</text><text x="262" y="816" fill="#59636e" font-size="10">bundled runtime.</text><line x1="28" y1="852" x2="820" y2="852" stroke="#d0d7de" stroke-width="1"/><text x="28" y="870" fill="#1f2328" font-size="14" font-weight="650">Per-prompt harness tax</text><text x="820" y="870" text-anchor="end" fill="#59636e" font-size="10.5">lower is better · log</text><text x="250" y="904" text-anchor="end" fill="#059669" font-size="12" font-weight="600">freedas</text><rect x="262" y="890" width="167.7" height="19" rx="5" fill="url(#fdg)"/><text x="439" y="904" fill="#059669" font-size="11.5" font-weight="600">13 ms</text><rect x="510" y="886" width="308" height="13" rx="6.5" fill="#fdeee3"/><text x="664" y="895.8" text-anchor="middle" fill="#8a3b12" font-size="8.8" font-weight="700">Per-prompt: 130× faster than Claude Code · 1690ms→13ms</text><rect x="532" y="902" width="286" height="13" rx="6.5" fill="#e9edf3"/><text x="675" y="911.8" text-anchor="middle" fill="#475569" font-size="8.8" font-weight="700">Per-prompt: 6× faster than old freedas · 80ms→13ms</text><text x="250" y="940" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">freedas (pre-lazy)</text><rect x="262" y="926" width="261.2" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="532" y="940" fill="#59636e" font-size="11.5" font-weight="400">80 ms</text><text x="250" y="976" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Claude Code overhead</text><rect x="262" y="962" width="418.2" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="689" y="976" fill="#59636e" font-size="11.5" font-weight="400">1.69 s</text><text x="250" y="1012" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">median model response</text><rect x="262" y="998" width="448.0" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1" opacity="0.45"/><text x="719" y="1012" fill="#59636e" font-size="11.5" font-weight="400">3.01 s</text><text x="262" y="1044" fill="#59636e" font-size="10">Overhead beyond model time per trivial prompt. Claude Code: crewshal TTFT-study</text><text x="262" y="1058" fill="#59636e" font-size="10">median; freedas: full end-to-end run incl. lazy snapshot-skip.</text><line x1="28" y1="1094" x2="820" y2="1094" stroke="#d0d7de" stroke-width="1"/><text x="28" y="1112" fill="#1f2328" font-size="14" font-weight="650">Input tokens per trivial prompt</text><text x="820" y="1112" text-anchor="end" fill="#59636e" font-size="10.5">lower is better</text><text x="250" y="1146" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Pi · no tools</text><rect x="262" y="1132" width="10.7" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1" opacity="0.45"/><text x="282" y="1146" fill="#59636e" font-size="11.5" font-weight="400">466</text><text x="250" y="1182" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Claude Code --bare</text><rect x="262" y="1168" width="29.0" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1" opacity="0.45"/><text x="300" y="1182" fill="#59636e" font-size="11.5" font-weight="400">1.3k</text><text x="250" y="1218" text-anchor="end" fill="#059669" font-size="12" font-weight="600">freedas · 17 tools</text><rect x="262" y="1204" width="30.9" height="19" rx="5" fill="url(#fdg)"/><text x="302" y="1218" fill="#059669" font-size="11.5" font-weight="600">1.4k</text><rect x="500" y="1200" width="318" height="13" rx="6.5" fill="#fdeee3"/><text x="659" y="1209.8" text-anchor="middle" fill="#8a3b12" font-size="8.8" font-weight="700">Input tokens: 12.9× leaner than Claude Code · 17.4k→1.4k</text><rect x="532" y="1216" width="286" height="13" rx="6.5" fill="#d8f3e8"/><text x="675" y="1225.8" text-anchor="middle" fill="#046a4e" font-size="8.8" font-weight="700">Input tokens: 14.5× leaner than Codex · 19.6k→1.4k</text><text x="250" y="1254" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Pi · default</text><rect x="262" y="1240" width="37.6" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="309" y="1254" fill="#59636e" font-size="11.5" font-weight="400">1.6k</text><text x="250" y="1290" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Claude Code · 4 tools + short sys</text><rect x="262" y="1276" width="47.5" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="318" y="1290" fill="#59636e" font-size="11.5" font-weight="400">2.1k</text><text x="250" y="1326" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Claude Code · 4 tools</text><rect x="262" y="1312" width="76.0" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="347" y="1326" fill="#59636e" font-size="11.5" font-weight="400">3.3k</text><text x="250" y="1362" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Claude Code · 21 tools (default)</text><rect x="262" y="1348" width="398.7" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="670" y="1362" fill="#59636e" font-size="11.5" font-weight="400">17.4k</text><text x="250" y="1398" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Codex CLI</text><rect x="262" y="1384" width="448.0" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1"/><text x="719" y="1398" fill="#59636e" font-size="11.5" font-weight="400">19.6k</text><text x="262" y="1430" fill="#59636e" font-size="10">Tokens sent for a trivial request, full toolset unless noted. freedas measured via</text><text x="262" y="1444" fill="#59636e" font-size="10">FREEDAS_DUMP_REQUEST with an empty HOME (~1.4k tokens incl. 17 tool schemas). Pi/CC</text><text x="262" y="1458" fill="#59636e" font-size="10">rows: orbi.build single-request probes; ghosted rows are intentionally reduced</text><text x="262" y="1472" fill="#59636e" font-size="10">configs. Codex: crewshal measured 19,551 for a one-line request.</text></svg>