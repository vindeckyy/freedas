="400">median model response</text><rect x="262" y="838" width="448.0" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1" opacity="0.45"/><text x="719" y="852" fill="#59636e" font-size="11.5" font-weight="400">3.01 s</text><text x="262" y="884" fill="#59636e" font-size="10">Overhead beyond model time per trivial prompt. Claude Code: crewshal TTFT-study</text><text x="262" y="898" fill="#59636e" font-size="10">median; freedas: full end-to-end run incl. lazy snapshot-skip.</text><line x1="28" y1="934" x2="820" y2="934" stroke="#d0d7de" stroke-width="1"/><text x="28" y="952" fill="#1f2328" font-size="14" font-weight="650">Input tokens per trivial prompt</text><text x="820" y="952" text-anchor="end" fill="#59636e" font-size="10.5">lower is better</text><text x="250" y="978" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Pi · no tools</text><rect x="262" y="964" width="10.7" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1" opacity="0.45"/><text x="282" y="978" fill="#59636e" font-size="11.5" font-weight="400">466</text><text x="250" y="1006" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Claude Code --bare</text><rect x="262" y="992" width="29.0" height="19" rx="5" fill="#d0d7de" stroke="#afb8c1" stroke-width="1" opacity="0.45"/><text x="300" y="1006" fill="#59636e" font-size="11.5" font-weight="400">1.3k</text><text x="250" y="1034" text-anchor="end" fill="#059669" font-size="12" font-weight="600">freedas · 17 tools</text><rect x="262" y="1020" width="30.9" height="19" rx="5" fill="url(#fdg)"/><text x="302" y="1034" fill="#059669" font-size="11.5" font-weight="600">1.4k</text><rect x="672" y="1019.5" width="146" height="20" rx="10" fill="#d1fae5"/><text x="745" y="1033.5" text-anchor="middle" fill="#047857" font-size="10.5" font-weight="700">12.9× vs Claude Code</text><text x="250" y="1062" text-anchor="end" fill="#1f2328" font-size="12" font-weight="400">Pi · default</text><rect x="262" y="1048" 