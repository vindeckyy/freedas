# cargo-deny configuration for the Freedas workspace.
# Run with: cargo deny check

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
# Internal `path = "../..."` workspace deps count as wildcards; deny is
# meant for registry `*` requirements.
wildcards = "warn"
highlight = "all"
skip = []
skip-tree = []
deny = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  # Root CA bundles shipped with rustls are certified under CDLA-Permissive.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Per-crate exceptions for crates whose `license` field is allowed only here.
exceptions = [
  # `html2md` is GPL-3.0+; it is used only by `freedas-tools::webfetch` for
  # HTML->Markdown conversion. Remove this exception if the dependency is
  # replaced with an MIT/Apache-2.0 implementation.
  { name = "html2md", version = "*", allow = ["GPL-3.0-or-later"] },
  # wasmtime/cranelift are `Apache-2.0 WITH LLVM-exception`; the exception is a
  # patent-grant addendum and is acceptable for binary use.
  { name = "ar_archive_writer", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-assembler-x64", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-assembler-x64-meta", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-bforest", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-bitset", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-codegen", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-codegen-meta", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-codegen-shared", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-control", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-entity", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-frontend", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-isle", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-native", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "cranelift-srcgen", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "pulley-interpreter", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "pulley-macros", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "regalloc2", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "target-lexicon", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "wasmtime", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "wasmtime-environ", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "wasmtime-internal-component-macro", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "wasmtime-internal-component-util", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "wasmtime-internal-core", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "wasmtime-internal-cranelift", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "wasmtime-internal-jit-icache-coherence", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "wasmtime-internal-unwinder", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "wasmtime-internal-versioned-export-macros", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "wasmtime-internal-wit-bindgen", version = "*", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[output]
feature-depth = 1
